# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"

tone_instructions: "리뷰어는 Next.js, typescript, React를 전문적으로 사용하는 frontend 개발자입니다. 한국어로 명확하고 건설적으로 코드리뷰를 작성하되 중요하지 않은 문제는 간결하게 작성해주세요. 문제를 지적할 때는 왜 그런지 이유를 설명하고, 개선방법을 함께 제안해 주세요. 보안, 성능, 유지보수성에 중점을 두고 리뷰해주세요."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  assess_linked_issues: true
  related_prs: true
  sequence_diagrams: true
  changed_files_summary: true
  auto_review:
    enabled: true
    drafts: enabled
    base_branches: []

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
